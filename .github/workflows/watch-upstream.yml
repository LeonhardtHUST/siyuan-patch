name: watch-upstream

# 上游 SiYuan 发新版本后自动预演打补丁：
#   全部通过 → 触发 release-docker 构建完整镜像 tag vX.Y.Z-pN
#   任一失败 → 开 issue（assignee 会收到 GitHub 通知邮件），不构建
#
# 幂等判断只看 canonical 完整 tag（vX.Y.Z-pN），其中 N 来自仓库根 PATCH_REVISION。
# 旧的无后缀 vX.Y.Z 镜像视为 p0（仅历史/回滚），不参与判断，因此不会被误认为“已构建”。
# 补丁更新并递增 PATCH_REVISION 后，同一上游会自动构建新的 pN；canonical tag 不可覆写。

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "指定上游 tag vX.Y.Z 或完整 tag vX.Y.Z-pN（留空 = 自动取上游最新 release）"
        required: false
        default: ""
      patch_revision:
        description: "兼容输入：留空即使用仓库 PATCH_REVISION；填写则必须与之一致"
        required: false
        default: ""
      dry_run:
        description: "true = 只预演打补丁，不触发构建"
        required: false
        default: "false"

permissions:
  contents: read
  packages: read
  issues: write
  actions: write

concurrency:
  group: watch-upstream
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: 取目标版本并解析完整镜像 tag
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PATCH_REVISION: ${{ inputs.patch_revision }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-}"
          if [ -z "$version" ]; then
            version=$(gh api repos/siyuan-note/siyuan/releases/latest --jq .tag_name)
          fi
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "::error::拿不到上游版本"
            exit 1
          fi
          node scripts/image-version.mjs resolve \
            --version "$version" \
            --patch-revision "$INPUT_PATCH_REVISION" \
            --file PATCH_REVISION \
            --github-output "$GITHUB_OUTPUT"
          echo "上游 tag: $(grep '^upstream_tag=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)"
          echo "canonical tag: $(grep '^image_tag=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)"

      - name: 该完整镜像 tag 是否已构建
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ steps.target.outputs.image_tag }}
          UPSTREAM_TAG: ${{ steps.target.outputs.upstream_tag }}
          ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${OWNER,,}/siyuan"
          node scripts/registry-tag-state.mjs \
            --image "$image" \
            --actor "$ACTOR" \
            --token-env GHCR_TOKEN \
            --check "canonical=${IMAGE_TAG}" \
            --github-output "$GITHUB_OUTPUT"
          state=$(grep '^canonical_state=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)
          if [ "$state" = "exists" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${IMAGE_TAG} 已存在，跳过构建（旧无后缀 ${UPSTREAM_TAG} 视为 p0，不参与幂等判断）"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "canonical tag 缺失，开始预演打补丁"
          fi

      # 预演：与 release-docker 完全相同的顺序逐项校验：先 --check，通过后立即真实应用，
      # 让后一项在前一项的结果之上校验，避免只对 pristine 源逐个 --check 而漏掉组合冲突
      - name: 预演打补丁
        id: patches
        if: steps.image.outputs.exists == 'false'
        continue-on-error: true
        env:
          UPSTREAM_TAG: ${{ steps.target.outputs.upstream_tag }}
        run: |
          set -uo pipefail
          git clone --depth=1 --branch "$UPSTREAM_TAG" https://github.com/siyuan-note/siyuan.git upstream
          failed=0
          unchecked=0
          : > /tmp/report.md
          # 补丁顺序必须与 release-docker.yml 的 Clone upstream and apply patches 步骤保持一致
          # 注意：git -C upstream 会把工作目录切到 upstream/，补丁必须用绝对路径，
          # 否则相对路径会被解析成 upstream/patches/... 导致每个补丁都“打不上”
          for p in disable-update default-config mock-vip-user docker-build math-renderer-registry content-prefetch startup-slow-loading; do
            patch_file="${GITHUB_WORKSPACE}/patches/siyuan/${p}.patch"
            if [ "$unchecked" = 1 ]; then
              printf '⏭️ `%s.patch` —— 前序补丁未通过，本项未检查\n\n' "$p" >> /tmp/report.md
              continue
            fi
            if [ ! -f "$patch_file" ]; then
              failed=1
              unchecked=1
              printf '❌ `%s.patch` —— 仓库里找不到该文件\n\n' "$p" >> /tmp/report.md
              continue
            fi
            if ! out=$(git -C upstream apply --check "$patch_file" 2>&1); then
              failed=1
              unchecked=1
              printf '❌ `%s.patch`\n\n```\n%s\n```\n\n' "$p" "$out" >> /tmp/report.md
              echo "::error file=patches/siyuan/${p}.patch::补丁无法应用到 $UPSTREAM_TAG"
              continue
            fi
            if ! out=$(git -C upstream apply "$patch_file" 2>&1); then
              failed=1
              unchecked=1
              printf '❌ `%s.patch` —— 校验通过但应用失败\n\n```\n%s\n```\n\n' "$p" "$out" >> /tmp/report.md
              echo "::error file=patches/siyuan/${p}.patch::补丁无法应用到 $UPSTREAM_TAG"
              continue
            fi
            printf '✅ `%s.patch`\n\n' "$p" >> /tmp/report.md
          done
          cat /tmp/report.md
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          exit "$failed"

      - name: 补丁失配 → 开 issue
        if: steps.patches.outputs.failed == '1'
        id: notify
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ steps.target.outputs.image_tag }}
          UPSTREAM_TAG: ${{ steps.target.outputs.upstream_tag }}
          PATCH_REVISION: ${{ steps.target.outputs.patch_revision }}
          OWNER: ${{ github.repository_owner }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
        run: |
          set -uo pipefail
          {
            echo "## 补丁无法应用到 ${UPSTREAM_TAG}（目标镜像 ${IMAGE_TAG}）"
            echo
            cat /tmp/report.md
          } >> "$GITHUB_STEP_SUMMARY"

          title="patch-drift: ${IMAGE_TAG}"
          if gh issue list --state open --search "in:title ${IMAGE_TAG}" --json title --jq '.[].title' | grep -qx "$title"; then
            echo "已有同名 open issue，跳过创建"
          else
            {
              echo "上游已发布 \`${UPSTREAM_TAG}\`，目标镜像 \`${IMAGE_TAG}\`（PATCH_REVISION=${PATCH_REVISION}），但补丁无法干净应用，**未触发构建**。"
              echo
              cat /tmp/report.md
              echo "---"
              echo "### 处理步骤"
              echo '```bash'
              echo "git clone --branch ${UPSTREAM_TAG} --depth=1 https://github.com/siyuan-note/siyuan.git"
              echo "cd siyuan && git apply --check /path/to/siyuan-patch/patches/siyuan/<patch>"
              echo '```'
              echo "1. 用 \`git apply --3way\` 或 \`patch -p1 --fuzz=3\` 重打，**核对语义**（不要只看能打上）"
              echo "2. 更新 \`patches/siyuan/*.patch\`，并递增 \`PATCH_REVISION\`（同一 upstream 的镜像内容变更必须换新 pN）"
              echo "3. 重跑 \`watch-upstream\`"
            } > /tmp/issue.md
            gh issue create --title "$title" --body-file /tmp/issue.md --assignee "$OWNER" \
              || echo "::warning::issue 创建失败（仓库可能关闭了 Issues），请查看本次 run 的 Summary"
          fi

          if [ -n "${SMTP_HOST:-}" ]; then
            echo "smtp=true" >> "$GITHUB_OUTPUT"
          else
            echo "smtp=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 可选：SMTP 邮件告警
        if: steps.patches.outputs.failed == '1' && steps.notify.outputs.smtp == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT || 465 }}
          secure: true
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "[siyuan-patch] 补丁失配：${{ steps.target.outputs.image_tag }}（上游 ${{ steps.target.outputs.upstream_tag }}）"
          to: ${{ secrets.MAIL_TO }}
          from: siyuan-patch CI <${{ secrets.SMTP_USER }}>
          body: |
            上游 ${{ steps.target.outputs.upstream_tag }} 的补丁预演失败，目标镜像 ${{ steps.target.outputs.image_tag }}，未触发构建。
            详情见 issue：patch-drift: ${{ steps.target.outputs.image_tag }}

      - name: 触发镜像构建
        if: steps.image.outputs.exists == 'false' && steps.patches.outputs.failed == '0' && inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ steps.target.outputs.image_tag }}
          PATCH_REVISION: ${{ steps.target.outputs.patch_revision }}
        run: |
          gh workflow run release-docker.yml --ref main -f version="$IMAGE_TAG" -f patch_revision="$PATCH_REVISION"
          echo "已触发 release-docker：$IMAGE_TAG"

      - name: 补丁失配时让 job 失败
        if: steps.patches.outputs.failed == '1'
        env:
          IMAGE_TAG: ${{ steps.target.outputs.image_tag }}
        run: |
          echo "::error::补丁无法应用到 $IMAGE_TAG，已开 issue"
          exit 1
