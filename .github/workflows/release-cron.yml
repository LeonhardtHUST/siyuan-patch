name: release-cron

# 定时检查上游版本并创建上游语义的 GitHub Release（tag = 上游 vX.Y.Z）。
#
# 版本纪律边界（详见 PATCHES.md）：
# - 本 workflow 的 GitHub Release 仍代表上游版本 vX.Y.Z，不创建 vX.Y.Z-pN Release；
# - Docker 镜像由 release-docker 按完整 tag vX.Y.Z-pN 发布，N 来自仓库 PATCH_REVISION；
# - PC / iOS / Android 现有发行流程仍跟随上游 vX.Y.Z，本轮不迁移到 -pN。

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  create_release:
    name: get version and create release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Check upstream version and whether we already have it
        id: check
        run: |
          pkg_json=$(curl -fsSL "https://raw.githubusercontent.com/siyuan-note/siyuan/master/app/package.json")
          upstream_ver=$(echo "$pkg_json" | grep '"version"' | head -1 | awk -F: '{print $2}' | sed 's/[", ]//g')
          tag="v${upstream_ver}"
          pkg_mgr=$(echo "$pkg_json" | grep '"packageManager"' | head -1 | awk -F: '{print $2}' | sed 's/[", ]//g')

          echo "upstream_tag=${tag}" >> $GITHUB_OUTPUT
          echo "package_manager=${pkg_mgr}" >> $GITHUB_OUTPUT
          echo "Upstream version: ${tag}"

          status_code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}")

          if [[ "$status_code" == "200" ]]; then
            echo "Tag/release ${tag} already exists → skip."
            echo "needs_release=false" >> $GITHUB_OUTPUT
          elif [[ "$status_code" == "404" ]]; then
            echo "Tag/release ${tag} does NOT exist → will create."
            echo "needs_release=true" >> $GITHUB_OUTPUT
          else
            echo "Unexpected status: ${status_code} → aborting for safety."
            exit 1
          fi

      - name: Resolve patch image tag
        id: image
        if: steps.check.outputs.needs_release == 'true'
        run: |
          set -euo pipefail
          node scripts/image-version.mjs resolve \
            --version "${{ steps.check.outputs.upstream_tag }}" \
            --file PATCH_REVISION \
            --github-output "$GITHUB_OUTPUT"

      - name: Create Release
        if: ${{ steps.check.outputs.needs_release == 'true' }}
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: ${{ steps.check.outputs.upstream_tag }}
          name: ${{ steps.check.outputs.upstream_tag }}
          body: |
            Sync with upstream release.

            Docker 镜像按完整补丁 tag `${{ steps.image.outputs.image_tag }}` 单独发布（N 来自仓库 PATCH_REVISION），不属于本 Release 的附件；PC / iOS / Android 构建仍跟随上游 `${{ steps.check.outputs.upstream_tag }}`。
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Dispatch builds
        if: ${{ steps.check.outputs.needs_release == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver="${{ steps.check.outputs.upstream_tag }}"
          pm="${{ steps.check.outputs.package_manager }}"
          image_tag="${{ steps.image.outputs.image_tag }}"
          patch_revision="${{ steps.image.outputs.patch_revision }}"

          echo "Dispatching builds for upstream $ver with $pm"
          echo "Docker image will use full tag $image_tag (PATCH_REVISION=$patch_revision)"

          echo "Triggering release-pc.yml（仍按上游 tag）..."
          gh workflow run release-pc.yml \
            --repo ${{ github.repository }} \
            --ref main \
            -f version="$ver" \
            -f packageManager="$pm"

          echo "Triggering release-docker.yml（完整补丁 tag）..."
          gh workflow run release-docker.yml \
            --repo ${{ github.repository }} \
            --ref main \
            -f version="$image_tag" \
            -f patch_revision="$patch_revision"

          echo "Triggering release-ios.yml（仍按上游 tag）..."
          gh workflow run release-ios.yml \
            --repo ${{ github.repository }} \
            --ref main \
            -f version="$ver" \
            -f packageManager="$pm" || echo "iOS workflow failed or not found (ignoring)."

          echo "Triggering release-android.yml（仍按上游 tag）..."
          gh workflow run release-android.yml \
            --repo ${{ github.repository }} \
            --ref main \
            -f version="$ver" \
            -f packageManager="$pm" || echo "Android workflow failed or not found (ignoring)."
