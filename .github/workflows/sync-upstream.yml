name: sync-upstream
# 每日自动跟随上游（MohamedElashri/siyuan-patch）：
# - 可 fast-forward 时直接同步 main
# - 出现分叉（我们自己的 patch 提交与上游冲突）时：把上游推到 sync/upstream-<date> 分支 + 开 issue，
#   绝不静默丢弃任一方
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/MohamedElashri/siyuan-patch.git
          # 只取分支，不带 --tags。本 fork 自己发布过 v3.8.8 / v3.8.10 等同名 release tag，
          # 指向我们的提交；父仓库的同名 tag 指向另一批提交。`--tags` 会因
          # "would clobber existing tag" 返回 1，在 bash -e 下直接中断整个步骤。
          # 本工作流后续只使用 upstream/main，不需要父仓库的 tag。
          git fetch upstream main --no-tags

      - name: Try fast-forward
        id: ff
        run: |
          if git merge-base --is-ancestor HEAD upstream/main; then
            git merge --ff-only upstream/main
            git push origin main
            echo "status=fast-forwarded" >> "$GITHUB_OUTPUT"
            echo "new_head=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "status=diverged" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish upstream branch for manual merge
        if: steps.ff.outputs.status == 'diverged'
        continue-on-error: true
        run: |
          # 记录上游 SHA，issue 里用它给出不依赖分支的等价命令。
          echo "UPSTREAM_SHA=$(git rev-parse upstream/main)" >> "$GITHUB_ENV"
          BRANCH="sync/upstream-$(date -u +%Y%m%d)"
          # GITHUB_TOKEN 不能创建或更新 .github/workflows/*.yml。父仓库的提交会改动这些文件，
          # 推送会被拒：refusing to allow a GitHub App to create or update workflow。
          # 这一步失败不中断任务；需要分支时改用带 workflow 权限的 PAT。
          if git push origin "upstream/main:refs/heads/${BRANCH}"; then
            echo "BRANCH=${BRANCH}" >> "$GITHUB_ENV"
          else
            echo "::warning::无法推送 ${BRANCH}（GITHUB_TOKEN 无 workflow 文件写权限），请按 issue 中的直接 fetch 步骤合并"
          fi

      - name: Open issue when diverged
        if: steps.ff.outputs.status == 'diverged'
        uses: actions/github-script@v7
        env:
          BRANCH: ${{ env.BRANCH }}
          UPSTREAM_SHA: ${{ env.UPSTREAM_SHA }}
        with:
          script: |
            const label = "upstream-sync";
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            const branch = process.env.BRANCH || "";
            const sha = process.env.UPSTREAM_SHA || "";
            const lines = [
              "上游 `MohamedElashri/siyuan-patch` 的 `main` 已与本 fork 分叉，无法快进合并。",
              "",
            ];
            if (sha) lines.push(`上游最新提交：\`${sha}\``);
            if (branch) lines.push(`上游已推送到分支 \`${branch}\`。`);
            if (sha || branch) lines.push("");
            lines.push(
              "处理步骤：",
              "```bash",
              "git fetch https://github.com/MohamedElashri/siyuan-patch main",
              "git merge FETCH_HEAD",
              "```",
              "解决冲突（重点：`patches/siyuan/math-renderer-registry.patch` 的上下文是否仍匹配新版本源码）后 `git push`，再关闭本 issue。",
            );
            const body = lines.join("\n");
            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: "上游分叉，需要手动合并 (" + new Date().toISOString().slice(0, 10) + ")",
                labels: [label],
                body,
              });
            }

      - name: Summary
        run: |
          echo "sync status: ${{ steps.ff.outputs.status }}"
          echo "head: $(git rev-parse --short HEAD)"
